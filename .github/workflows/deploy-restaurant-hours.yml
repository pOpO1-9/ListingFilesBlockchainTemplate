name: Deploy Heures resto (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "restaurant-hours/**"
      - ".github/workflows/deploy-restaurant-hours.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-restaurant-hours
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload restaurant-hours site
        uses: actions/upload-pages-artifact@v3
        with:
          path: restaurant-hours
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
